version: "3.8"

services:
  onlyoffice:
    image: onlyoffice/documentserver
    user: root
    ports:
      - "8082:80"
    environment:
      # Backend should set ONLYOFFICE_JWT_SECRET to match this value.
      # Frontend should use VITE_ONLYOFFICE_URL=http://localhost:8082
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
